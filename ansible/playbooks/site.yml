---
- name: Stage 1 - Host baseline and runtime packages
  hosts: k8s_cluster
  become: true
  environment: "{{ lab_proxy_environment }}"
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: common
    - role: containerd
    - role: kubernetes

- name: Stage 1 - Initialize the control plane
  hosts: kube_control_plane
  become: true
  environment: "{{ lab_proxy_environment }}"
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: control_plane

- name: Stage 1 - Apply Calico only, without blocking on workload readiness
  hosts: kube_control_plane
  become: true
  environment: "{{ lab_proxy_environment }}"
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: calico

- name: Stage 1 - Join workers without waiting for CNI-dependent readiness
  hosts: kube_workers
  become: true
  environment: "{{ lab_proxy_environment }}"
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: worker_join

- name: Stage 1 - Configure bounded kubelet image pull parallelism
  hosts: k8s_cluster
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Stat kubelet configuration
      ansible.builtin.stat:
        path: /var/lib/kubelet/config.yaml
      register: kubelet_config_file

    - name: Assert kubelet configuration exists and pull parallelism is bounded
      ansible.builtin.assert:
        that:
          - kubelet_config_file.stat.exists
          - kubelet_max_parallel_image_pulls | int >= 1
          - kubelet_max_parallel_image_pulls | int <= 4
        fail_msg: >-
          /var/lib/kubelet/config.yaml must already exist after node
          initialization, and kubelet_max_parallel_image_pulls must be between
          1 and 4 (got {{ kubelet_max_parallel_image_pulls }}).
        quiet: true

    - name: Disable serialized image pulls
      ansible.builtin.lineinfile:
        path: /var/lib/kubelet/config.yaml
        regexp: '^serializeImagePulls:'
        line: 'serializeImagePulls: false'
        create: false
      notify: Restart kubelet after image pull policy change

    - name: Bound parallel image pulls
      ansible.builtin.lineinfile:
        path: /var/lib/kubelet/config.yaml
        regexp: '^maxParallelImagePulls:'
        line: "maxParallelImagePulls: {{ kubelet_max_parallel_image_pulls }}"
        create: false
      notify: Restart kubelet after image pull policy change

  handlers:
    - name: Restart kubelet after image pull policy change
      ansible.builtin.systemd:
        name: kubelet
        state: restarted

- name: Stage 1 - Verify cluster, CNI and DNS convergence
  hosts: kube_control_plane
  become: true
  environment: "{{ lab_proxy_environment }}"
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Wait for all expected nodes to be Ready
      ansible.builtin.command:
        argv:
          - timeout
          - "330"
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - --request-timeout=15s
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=300s
      changed_when: false

    - name: Wait for kube-proxy on every node
      ansible.builtin.command:
        argv:
          - timeout
          - "200"
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - --request-timeout=15s
          - -n
          - kube-system
          - rollout
          - status
          - daemonset/kube-proxy
          - --timeout=180s
      register: kube_proxy_rollout
      changed_when: false
      until: kube_proxy_rollout.rc == 0
      retries: 5
      delay: 10

    - name: Wait for Calico node on every node
      ansible.builtin.command:
        argv:
          - timeout
          - "200"
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - --request-timeout=15s
          - -n
          - kube-system
          - rollout
          - status
          - daemonset/calico-node
          - --timeout=180s
      register: calico_rollout_after_join
      changed_when: false
      until: calico_rollout_after_join.rc == 0
      retries: 5
      delay: 10

    - name: Wait for Calico kube-controllers
      ansible.builtin.command:
        argv:
          - timeout
          - "200"
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - --request-timeout=15s
          - -n
          - kube-system
          - rollout
          - status
          - deployment/calico-kube-controllers
          - --timeout=180s
      register: calico_controllers_rollout
      changed_when: false
      until: calico_controllers_rollout.rc == 0
      retries: 5
      delay: 10

    - name: Wait for CoreDNS
      ansible.builtin.command:
        argv:
          - timeout
          - "200"
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - --request-timeout=15s
          - -n
          - kube-system
          - rollout
          - status
          - deployment/coredns
          - --timeout=180s
      register: coredns_rollout
      changed_when: false
      until: coredns_rollout.rc == 0
      retries: 5
      delay: 10

    - name: Read final node table
      ansible.builtin.command:
        argv:
          - timeout
          - "20"
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - --request-timeout=15s
          - get
          - nodes
          - -o
          - wide
      register: final_nodes
      changed_when: false

    - name: Show final node table
      ansible.builtin.debug:
        var: final_nodes.stdout_lines
