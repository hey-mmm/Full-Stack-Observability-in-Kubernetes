---
- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    checksum: "sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570"
    dest: "{{ docker_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"
    force: false
    timeout: 30

- name: Configure Docker apt repository for jammy
  ansible.builtin.copy:
    dest: "{{ docker_apt_source }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ docker_apt_repo }}
  register: docker_repo

- name: Refresh apt cache after Docker repository change
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed

- name: Ensure apt cache is available
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install pinned containerd.io
  ansible.builtin.apt:
    name: "containerd.io={{ containerd_version }}"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true
  notify: Restart containerd

- name: Hold containerd.io package version
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: hold

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: "{{ containerd_config | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The lab registry is reachable only through the host-side FlClash proxy.
# Keep the drop-in managed by this role and remove it only when no proxy is set.
- name: Ensure containerd systemd drop-in directory exists when a proxy is configured
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: containerd_http_proxy | length > 0

- name: Install managed containerd systemd proxy drop-in
  ansible.builtin.template:
    src: proxy.conf.j2
    dest: /etc/systemd/system/containerd.service.d/10-proxy.conf
    owner: root
    group: root
    mode: "0644"
  when: containerd_http_proxy | length > 0
  notify: Restart containerd

- name: Remove managed containerd proxy drop-in when no proxy is configured
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d/10-proxy.conf
    state: absent
  when: containerd_http_proxy | length == 0
  notify: Restart containerd

- name: Install deterministic containerd v3 configuration
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ containerd_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

# The registry config_path is intentionally fixed to /etc/containerd/certs.d.
# Keep the supported registry set small so cleanup is deterministic.
- name: Validate the containerd registry mirror map
  ansible.builtin.assert:
    that:
      - containerd_registry_mirrors is mapping
      - >-
        containerd_registry_mirrors.keys() | list
        | difference(containerd_registry_servers.keys() | list) | length == 0
    fail_msg: >-
      containerd_registry_mirrors only supports the fixed registries
      {{ containerd_registry_servers.keys() | list | join(', ') }}.

- name: Ensure containerd registry configuration directory exists
  ansible.builtin.file:
    path: "{{ containerd_registry_config_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure per-registry configuration directories exist
  ansible.builtin.file:
    path: "{{ containerd_registry_config_path }}/{{ item.key }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ containerd_registry_mirrors | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Install pull-only registry mirror hosts.toml
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "{{ containerd_registry_config_path }}/{{ item.key }}/hosts.toml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ containerd_registry_mirrors | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart containerd

# On an empty or reduced mirror map, remove only hosts.toml files carrying the
# role marker. A user-supplied hosts.toml at the same path is left untouched.
- name: Check ownership of existing hosts.toml before cleanup
  ansible.builtin.command:
    argv:
      - grep
      - -Fq
      - "{{ containerd_registry_managed_marker }}"
      - "{{ containerd_registry_config_path }}/{{ item }}/hosts.toml"
  loop: "{{ containerd_registry_servers.keys() | list }}"
  when: item not in containerd_registry_mirrors
  register: containerd_registry_cleanup_check
  changed_when: false
  failed_when: false

- name: Remove role-managed hosts.toml when a registry mirror is not configured
  ansible.builtin.file:
    path: "{{ containerd_registry_config_path }}/{{ item.item }}/hosts.toml"
    state: absent
  loop: "{{ containerd_registry_cleanup_check.results }}"
  when: item.rc | default(1) == 0
  notify: Restart containerd

- name: Remove empty per-registry directories after managed config cleanup
  ansible.builtin.command:
    argv:
      - rmdir
      - "{{ containerd_registry_config_path }}/{{ item.item }}"
  loop: "{{ containerd_registry_cleanup_check.results }}"
  when: item.rc | default(1) == 0
  register: containerd_registry_dir_cleanup
  changed_when: containerd_registry_dir_cleanup.rc == 0
  failed_when: false

- name: Install crictl configuration pinned to the containerd CRI socket
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Apply containerd configuration before Kubernetes starts
  ansible.builtin.meta: flush_handlers

- name: Wait for containerd CRI socket
  ansible.builtin.wait_for:
    path: /run/containerd/containerd.sock
    timeout: 30

- name: Verify containerd v3 config enables the systemd cgroup driver
  ansible.builtin.command:
    argv:
      - timeout
      - "10"
      - grep
      - -Eq
      - '^[[:space:]]*SystemdCgroup[[:space:]]*=[[:space:]]*true'
      - "{{ containerd_config }}"
  changed_when: false

- name: Verify the configured pause image is pinned in config v3
  ansible.builtin.command:
    argv:
      - timeout
      - "10"
      - grep
      - -Fq
      - "sandbox = '{{ containerd_pause_image }}'"
      - "{{ containerd_config }}"
  changed_when: false

- name: Read containerd plugin list
  ansible.builtin.command:
    argv:
      - timeout
      - "20"
      - ctr
      - --address
      - /run/containerd/containerd.sock
      - plugins
      - ls
  register: containerd_plugins
  changed_when: false
  retries: 6
  delay: 5
  until: >-
    containerd_plugins.rc == 0 and
    containerd_plugins.stdout is search('(?m)^io[.]containerd[.]cri[.]v1 +runtime +.* +ok *$') and
    containerd_plugins.stdout is search('(?m)^io[.]containerd[.]cri[.]v1 +images +.* +ok *$')

- name: Assert CRI runtime and image plugins are loaded
  ansible.builtin.assert:
    that:
      - "containerd_plugins.stdout is search('(?m)^io[.]containerd[.]cri[.]v1 +runtime +.* +ok *$')"
      - "containerd_plugins.stdout is search('(?m)^io[.]containerd[.]cri[.]v1 +images +.* +ok *$')"
    fail_msg: >-
      containerd is running but the CRI runtime/image plugins are not loaded.
      Inspect journalctl -u containerd and the rendered config.
    success_msg: "containerd CRI runtime and image plugins are loaded."
