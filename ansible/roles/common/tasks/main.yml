---
- name: Assert supported Ubuntu 22.04 host
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_version'] is version("22.04", ">=")
      - ansible_facts['distribution_version'] is version("22.10", "<")
    fail_msg: >-
      This playbook supports Ubuntu 22.04.x only; detected
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    success_msg: "Ubuntu 22.04.x detected."

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Detect an already enrolled kubelet before hostname changes
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: existing_kubelet_conf

- name: Refuse to rename a node that may already belong to a cluster
  ansible.builtin.assert:
    that:
      - not existing_kubelet_conf.stat.exists or ansible_facts['hostname'] == common_hostname
    fail_msg: >-
      The host is named {{ ansible_facts['hostname'] }} but inventory requires
      {{ common_hostname }}, and /etc/kubernetes/kubelet.conf exists. Refusing
      to rename an enrolled node. Clean the legacy cluster deliberately or
      align the inventory with the existing hostname.
    success_msg: "Hostname and enrollment state are consistent."

- name: Set the explicit inventory hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
    use: systemd

- name: Keep the explicit hostname resolvable in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ common_hostname }}"
    state: present

# kubelet builds each ClusterFirst Pod resolv.conf from
# /run/systemd/resolve/resolv.conf (see resolvConf in the KubeletConfiguration),
# which systemd-resolved generates from this file and appends to the cluster
# search domains. A leftover "localdomain" search domain makes glibc expand a
# fully qualified Service name (svc.ns.svc.cluster.local has fewer than the
# configured ndots:5) to "<name>.localdomain" before trying the absolute name.
# A lab upstream that answers non-existent names with an address (fake-IP /
# proxy DNS) then wins with a bogus address, so in-cluster HTTP fails while
# short names still work. Keep the node search list free of that domain.
- name: Remove the stale localdomain search domain from the node resolver
  ansible.builtin.lineinfile:
    path: /etc/resolv.conf
    regexp: '^search[ \t]+localdomain[ \t]*$'
    state: absent
    backup: true
  notify: Restart systemd-resolved

- name: Verify the node resolver does not advertise localdomain
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - '(^|[[:space:]])localdomain([[:space:]]|$)'
      - /etc/resolv.conf
  register: node_resolver_localdomain
  changed_when: false
  failed_when: node_resolver_localdomain.rc != 1

- name: Persist kernel modules required by Kubernetes and Calico
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: "{{ kernel_modules | join('\n') }}\n"

- name: Load kernel modules now
  ansible.builtin.command:
    argv:
      - modprobe
      - "{{ item }}"
  loop: "{{ kernel_modules }}"
  changed_when: false

- name: Persist Kubernetes sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl settings
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: false

- name: Disable active swap
  ansible.builtin.command:
    argv:
      - swapoff
      - -a
  when: ansible_facts['swaptotal_mb'] | int > 0

- name: Disable swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '(?m)^(?!#)([^#\n]*\sswap\s+[^\n]*)$'
    replace: '# \1'
    backup: true

- name: Ensure timezone is configured
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure systemd-timesyncd is enabled
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true

- name: Ensure NTP synchronization is enabled
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-ntp
      - "true"
  changed_when: false

- name: Verify swap is disabled
  ansible.builtin.command:
    argv:
      - swapon
      - --show
  register: swap_state
  changed_when: false
  failed_when: swap_state.stdout | trim | length > 0

- name: Verify forwarding sysctl is active
  ansible.builtin.command:
    argv:
      - sysctl
      - -n
      - net.ipv4.ip_forward
  register: ip_forward
  changed_when: false
  failed_when: ip_forward.stdout | trim != "1"
