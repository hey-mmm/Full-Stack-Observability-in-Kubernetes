---
- name: Assert supported Ubuntu 22.04 host
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("22.04", ">=")
      - ansible_distribution_version is version("22.10", "<")
    fail_msg: >-
      This playbook supports Ubuntu 22.04.x only; detected
      {{ ansible_distribution }} {{ ansible_distribution_version }}.
    success_msg: "Ubuntu 22.04.x detected."

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Detect an already enrolled kubelet before hostname changes
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: existing_kubelet_conf

- name: Refuse to rename a node that may already belong to a cluster
  ansible.builtin.assert:
    that:
      - not existing_kubelet_conf.stat.exists or ansible_hostname == common_hostname
    fail_msg: >-
      The host is named {{ ansible_hostname }} but inventory requires
      {{ common_hostname }}, and /etc/kubernetes/kubelet.conf exists. Refusing
      to rename an enrolled node. Clean the legacy cluster deliberately or
      align the inventory with the existing hostname.
    success_msg: "Hostname and enrollment state are consistent."

- name: Set the explicit inventory hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
    use: systemd

- name: Keep the explicit hostname resolvable in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ common_hostname }}"
    state: present

- name: Persist kernel modules required by Kubernetes and Calico
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: "{{ kernel_modules | join('\n') }}\n"

- name: Load kernel modules now
  ansible.builtin.command:
    argv:
      - modprobe
      - "{{ item }}"
  loop: "{{ kernel_modules }}"
  changed_when: false

- name: Persist Kubernetes sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl settings
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: false

- name: Disable active swap
  ansible.builtin.command:
    argv:
      - swapoff
      - -a
  when: ansible_swaptotal_mb | int > 0

- name: Disable swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '(?m)^(?!#)([^#\n]*\sswap\s+[^\n]*)$'
    replace: '# \1'
    backup: true

- name: Ensure timezone is configured
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure systemd-timesyncd is enabled
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true

- name: Ensure NTP synchronization is enabled
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-ntp
      - "true"
  changed_when: false

- name: Verify swap is disabled
  ansible.builtin.command:
    argv:
      - swapon
      - --show
  register: swap_state
  changed_when: false
  failed_when: swap_state.stdout | trim | length > 0

- name: Verify forwarding sysctl is active
  ansible.builtin.command:
    argv:
      - sysctl
      - -n
      - net.ipv4.ip_forward
  register: ip_forward
  changed_when: false
  failed_when: ip_forward.stdout | trim != "1"
