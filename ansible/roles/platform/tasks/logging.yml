---
- name: Require local-path before installing logging
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - --request-timeout=15s
      - get
      - storageclass
      - "{{ platform_local_path_storage_class }}"
  register: platform_logging_storage_check
  changed_when: false
  failed_when: false

- name: Explain that storage must be accepted first
  ansible.builtin.assert:
    that:
      - platform_logging_storage_check.rc == 0
    fail_msg: >-
      StorageClass {{ platform_local_path_storage_class }} is absent.
      Run --tags storage and its acceptance check before --tags logging.

- name: Ensure logging namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ platform_logging_namespace }}"
        labels:
          app.kubernetes.io/part-of: observability
          environment: lab

- name: Ensure root-only values directory
  ansible.builtin.file:
    path: "{{ platform_loki_values_remote | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy pinned Loki values to the master
  ansible.builtin.copy:
    src: "{{ role_path }}/files/values/loki.yaml"
    dest: "{{ platform_loki_values_remote }}"
    owner: root
    group: root
    mode: "0600"

- name: Copy pinned Alloy values to the master
  ansible.builtin.copy:
    src: "{{ role_path }}/files/values/alloy.yaml"
    dest: "{{ platform_alloy_values_remote }}"
    owner: root
    group: root
    mode: "0600"

- name: Ensure verified chart cache directory
  ansible.builtin.file:
    path: /opt/observability-charts
    state: directory
    mode: '0755'
- name: Cache checksum-pinned loki chart
  ansible.builtin.get_url:
    url: https://github.com/grafana-community/helm-charts/releases/download/loki-21.2.1/loki-21.2.1.tgz
    dest: /opt/observability-charts/loki-21.2.1.tgz
    checksum: sha256:618a5235aecd36d0977de9be221382d659c5ebf7d4ab4a7d85e0880e8824d517
    timeout: 90
    mode: '0644'

- name: Ensure verified chart cache directory
  ansible.builtin.file:
    path: /opt/observability-charts
    state: directory
    mode: '0755'
- name: Cache checksum-pinned alloy chart
  ansible.builtin.get_url:
    url: https://github.com/grafana/helm-charts/releases/download/alloy-1.15.0/alloy-1.15.0.tgz
    dest: /opt/observability-charts/alloy-1.15.0.tgz
    checksum: sha256:2ecc96c05004cc01a45ab23cb390194ad5259ec9d02b42bf148d4468d013aaa3
    timeout: 90
    mode: '0644'

- name: Deploy Loki 21.2.1 monolithic single-binary and wait for readiness
  kubernetes.core.helm:
    name: "{{ platform_loki_release }}"
    chart_ref: /opt/observability-charts/loki-21.2.1.tgz
    chart_version: "{{ platform_loki_chart_version }}"
    release_namespace: "{{ platform_logging_namespace }}"
    create_namespace: false
    values_files:
      - "{{ platform_loki_values_remote }}"
    wait: true
    timeout: "20m"

- name: Deploy Alloy 1.15.0 log collector DaemonSet and wait for readiness
  kubernetes.core.helm:
    name: "{{ platform_alloy_release }}"
    chart_ref: /opt/observability-charts/alloy-1.15.0.tgz
    chart_version: "{{ platform_alloy_chart_version }}"
    release_namespace: "{{ platform_logging_namespace }}"
    create_namespace: false
    values_files:
      - "{{ platform_alloy_values_remote }}"
    wait: true
    timeout: "10m"

- name: Wait for Alloy DaemonSet on both nodes
  ansible.builtin.command:
    argv:
      - timeout
      - "300"
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - --request-timeout=15s
      - -n
      - "{{ platform_logging_namespace }}"
      - rollout
      - status
      - daemonset/alloy
      - --timeout=240s
  changed_when: false

- name: Show logging install summary
  ansible.builtin.debug:
    msg:
      - "Loki chart: {{ platform_loki_chart_version }} (app {{ platform_loki_app_version }}), Monolithic/singleBinary"
      - "Loki retention: {{ platform_loki_retention }} with compactor retention_enabled=true and delete_request_store=filesystem"
      - "Loki service for Grafana: http://loki.{{ platform_logging_namespace }}.svc.cluster.local:3100"
      - "Alloy chart: {{ platform_alloy_chart_version }} (app {{ platform_alloy_app_version }}), DaemonSet tolerates control-plane NoSchedule"
      - "Run scripts/acceptance/observability.sh --phase logging."
