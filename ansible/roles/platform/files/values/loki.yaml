deploymentMode: Monolithic
fullnameOverride: loki
sidecar:
  rules:
    enabled: false
loki:
  auth_enabled: false
  image:
    registry: docker.io
    repository: grafana/loki
    tag: 3.7.9
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
    - from: '2024-04-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
  storage:
    type: filesystem
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 72h
    reject_old_samples: true
    reject_old_samples_max_age: 72h
  pattern_ingester:
    enabled: false
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  extraEnv:
  - name: GOMEMLIMIT
    value: 800MiB
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path
    accessModes:
    - ReadWriteOnce
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcached:
  enabled: false
lokiCanary:
  enabled: false
backend:
  enabled: false
  replicas: 0
read:
  enabled: false
  replicas: 0
write:
  enabled: false
  replicas: 0
test:
  enabled: false
