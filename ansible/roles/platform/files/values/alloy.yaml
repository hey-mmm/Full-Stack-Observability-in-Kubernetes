fullnameOverride: alloy
crds:
  create: false
image:
  registry: docker.io
  repository: grafana/alloy
  tag: v1.21.3
controller:
  type: daemonset
  tolerations:
  - operator: Exists
  volumes:
    extra:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
        type: Directory
alloy:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  mounts:
    varlog: false
    dockercontainers: false
    extra:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  configMap:
    create: true
    content: "discovery.kubernetes \"pods\" {\n  role = \"pod\"\n  selectors {\n    role = \"pod\"\n    field = \"spec.nodeName=\"\
      \ + sys.env(\"NODE_NAME\")\n  }\n}\n\ndiscovery.relabel \"pod_logs\" {\n  targets = discovery.kubernetes.pods.targets\n\
      \n  rule {\n    source_labels = [\"__meta_kubernetes_namespace\"]\n    target_label  = \"namespace\"\n  }\n  rule {\n\
      \    source_labels = [\"__meta_kubernetes_pod_name\"]\n    target_label  = \"pod\"\n  }\n  rule {\n    source_labels\
      \ = [\"__meta_kubernetes_pod_node_name\"]\n    target_label  = \"node\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_container_name\"\
      ]\n    target_label  = \"container\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_uid\", \"__meta_kubernetes_pod_container_name\"\
      ]\n    separator     = \"/\"\n    replacement   = \"/var/log/pods/*$1/*.log\"\n    target_label  = \"__path__\"\n  }\n\
      \  # Drop discovery metadata. Only the four requested labels and\n  # __path__ survive; the JSON body (including request_id)\
      \ is untouched.\n  rule {\n    action = \"labeldrop\"\n    regex  = \"__meta_.*\"\n  }\n}\n\nloki.source.file \"pods\"\
      \ {\n  targets    = discovery.relabel.pod_logs.output\n  forward_to = [loki.process.pods.receiver]\n}\n\nloki.process\
      \ \"pods\" {\n  stage.cri {}\n  stage.json {\n    expressions = { level = \"level\", event = \"event\", status = \"\
      status\", request_id = \"request_id\" }\n  }\n  forward_to = [loki.write.default.receiver]\n}\n\nloki.write \"default\"\
      \ {\n  endpoint {\n    url = \"http://loki.logging.svc.cluster.local:3100/loki/api/v1/push\"\n  }\n}\n"
  extraEnv:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
serviceMonitor:
  enabled: false
