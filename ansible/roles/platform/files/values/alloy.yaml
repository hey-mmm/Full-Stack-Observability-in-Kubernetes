fullnameOverride: alloy
crds:
  create: false
image:
  registry: docker.io
  repository: grafana/alloy
  tag: v1.21.3
controller:
  type: daemonset
  tolerations:
  - operator: Exists
  volumes:
    extra:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
        type: Directory
alloy:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  mounts:
    varlog: false
    dockercontainers: false
    extra:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      // Drop discovery metadata. Only the four requested labels and
      // __path__ survive; the JSON body (including request_id) is untouched.
        rule {
          action = "labeldrop"
          regex  = "__meta_.*"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pod_logs.output
        sync_period  = "5s"
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        stage.json {
          expressions = { level = "level", event = "event", status = "status", request_id = "request_id" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
  extraEnv:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
serviceMonitor:
  enabled: false
